version: "3.8"
services:
  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./frontend/dist:/srv/www/static
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php
      - nodejs
      - mysql
      - pg
    networks:
      default:
        aliases:
          - demo-app.local
  nodejs:
    image: node:alpine
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      DB_HOST: pg
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB_NESTJS}
      KC_AUTH_SERVER_URL: ${KEYCLOAK_AUTH_SERVER_URL}
      KC_REALM: ${KEYCLOAK_REALM}
      KC_CLIENT_ID: ${KEYCLOAK_CLIENT_ID_NODE}
      KC_SECRET: ${KEYCLOAK_CLIENT_SECRET_NODE}
      APP_DOMAIN: ${APP_DOMAIN:-demo-app.local}
    working_dir: /home/app
    restart: always
    ports:
      - "${NODE_PORT:-3000}:3000"
    volumes:
      - ./node-app:/home/app
    depends_on:
      - php
    command: ["npm", "run", "start:dev"]
  php:
    image: webdevops/php-apache-dev:8.2
    ports:
      - "8000:80"
    volumes:
      - ./php-app:/app
    environment:
      WEB_DOCUMENT_ROOT: /app/public
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${MYSQL_DATABASE}
      DB_USERNAME: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
  mysql:
    image: mysql:latest
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3309:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    restart: always
  pg:
    image: postgres:13-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    restart: always
    volumes:
      - pg-data-01:/var/lib/postgresql/data
      - ./infra/postgres:/docker-entrypoint-initdb.d
  keycloak:
    image: keycloak/keycloak:24.0
    container_name: oauth
    ports:
      - 8080:8080
    environment:
      - KEYCLOAK_ADMIN=${KEYCLOAK_ADMIN}
      - KEYCLOAK_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD}
      - KC_DB=postgres
      - KC_DB_URL=jdbc:postgresql://pg:5432/${POSTGRES_DB_KEYCLOAK}
      - KC_DB_USERNAME=${POSTGRES_USER}
      - KC_DB_PASSWORD=${POSTGRES_PASSWORD}
      - KC_HTTP_RELATIVE_PATH=/auth
      - KC_PROXY_HEADERS=xforwarded
      - KC_LOG_LEVEL=org.keycloak.authorization:DEBUG
    command: [ "start-dev" ]
    depends_on:
      - pg
      - adminer
  adminer:
    image: adminer
    depends_on:
      - pg
    restart: always
    ports:
      - 8001:8080
volumes:
  pg-data-01:
  mysql-data:
